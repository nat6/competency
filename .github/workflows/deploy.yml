name: Deploy static Next.js to GitHub Pages (setup-gh-pages)

on:
  push:
    branches: [ setup-gh-pages ]
  pull_request:
    branches: [ setup-gh-pages ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 👇 главное: собираем с нужным префиксом для GH Pages
      - name: Build (static export with base path)
        run: NEXT_PUBLIC_BASE_PATH="/competency" npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    if: github.ref == 'refs/heads/setup-gh-pages'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
